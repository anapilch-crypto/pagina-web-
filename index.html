<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mundo do Xadrez | Rosa & Branco</title>
    <style>
        :root {
            --primary: #d81b60;       
            --secondary: #f48fb1;     
            --bg-light: #fff5f8;      
            --dark: #2c3e50;
            --board-light: #ffffff;   
            --board-dark: #f06292;    
            --selected: #f8bbd0;      
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-light);
            color: var(--dark);
            line-height: 1.6;
        }

        header {
            background-color: var(--primary);
            color: white;
            padding: 1rem 2rem;
            position: sticky;
            top: 0;
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 10px rgba(216, 27, 96, 0.2);
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 1.5rem;
            font-weight: bold;
        }

        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        section {
            margin-bottom: 3rem;
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(216, 27, 96, 0.05);
        }

        h2 {
            color: var(--primary);
            margin-bottom: 1.5rem;
            border-bottom: 3px solid var(--secondary);
            padding-bottom: 0.5rem;
            display: inline-block;
        }

        .game-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
            margin-top: 2rem;
        }

        .status-panel {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--primary);
            background: white;
            padding: 0.5rem 2rem;
            border-radius: 20px;
            border: 2px solid var(--secondary);
        }

        /* TABULEIRO FIXO E SEGURO */
        .board {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            width: 440px;
            height: 440px;
            border: 6px solid var(--primary);
            border-radius: 4px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            background-color: var(--board-light);
        }

        .square {
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2.5rem;
            cursor: pointer;
            user-select: none;
        }

        /* Cores alternadas das casas mapeadas estaticamente */
        .board .square:nth-child(8n+1) { background-color: var(--board-light); }
        .board .square:nth-child(8n+2) { background-color: var(--board-dark); }
        .board .square:nth-child(8n+3) { background-color: var(--board-light); }
        .board .square:nth-child(8n+4) { background-color: var(--board-dark); }
        .board .square:nth-child(8n+5) { background-color: var(--board-light); }
        .board .square:nth-child(8n+6) { background-color: var(--board-dark); }
        .board .square:nth-child(8n+7) { background-color: var(--board-light); }
        .board .square:nth-child(8n+8) { background-color: var(--board-dark); }

        /* Inversão de linhas ímpares do xadrez */
        .board .square:nth-child(10) , .board .square:nth-child(12) , .board .square:nth-child(14) , .board .square:nth-child(16) ,
        .board .square:nth-child(26) , .board .square:nth-child(28) , .board .square:nth-child(30) , .board .square:nth-child(32) ,
        .board .square:nth-child(42) , .board .square:nth-child(44) , .board .square:nth-child(46) , .board .square:nth-child(48) ,
        .board .square:nth-child(58) , .board .square:nth-child(60) , .board .square:nth-child(62) , .board .square:nth-child(64) {
            background-color: var(--board-light);
        }
        .board .square:nth-child(9) , .board .square:nth-child(11) , .board .square:nth-child(13) , .board .square:nth-child(15) ,
        .board .square:nth-child(25) , .board .square:nth-child(27) , .board .square:nth-child(29) , .board .square:nth-child(31) ,
        .board .square:nth-child(41) , .board .square:nth-child(43) , .board .square:nth-child(45) , .board .square:nth-child(47) ,
        .board .square:nth-child(57) , .board .square:nth-child(59) , .board .square:nth-child(61) , .board .square:nth-child(63) {
            background-color: var(--board-dark);
        }

        .square.selected {
            background-color: var(--selected) !important;
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 0.8rem 2rem;
            font-size: 1rem;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
        }

        footer {
            background-color: var(--dark);
            color: white;
            text-align: center;
            padding: 1.5rem;
            margin-top: 4rem;
        }

        @media (max-width: 480px) {
            .board { width: 320px; height: 320px; }
            .square { font-size: 1.8rem; }
        }
    </style>
</head>
<body>

        <h1>🌸 Mundo do Xadrez</h1>
        <nav>
            <a href="#tabuleiro">Jogar</a>
        </nav>
    </header>

                    <div class="square" data-row="5" data-col="0"></div><div class="square" data-row="5" data-col="1"></div><div class="square" data-row="5" data-col="2"></div><div class="square" data-row="5" data-col="3"></div><div class="square" data-row="5" data-col="4"></div><div class="square" data-row="5" data-col="5"></div><div class="square" data-row="5" data-col="6"></div><div class="square" data-row="5" data-col="7"></div>
                    <!-- Linha 6 -->
                    <div class="square" data-row="6" data-col="0">♙</div><div class="square" data-row="6" data-col="1">♙</div><div class="square" data-row="6" data-col="2">♙</div><div class="square" data-row="6" data-col="3">♙</div><div class="square" data-row="6" data-col="4">♙</div><div class="square" data-row="6" data-col="5">♙</div><div class="square" data-row="6" data-col="6">♙</div><div class="square" data-row="6" data-col="7">♙</div>
                    <!-- Linha 7 -->
